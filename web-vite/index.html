<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a0f" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="IAI Survivors" />
  <meta name="description" content="IAI Survivors - A survival/management game" />
  <title>IAI Survivors</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; }
    #game-canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
    #loading-screen {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; background: #0a0a0f; color: #c0c0c0;
      font-family: 'Courier New', monospace; z-index: 1000; transition: opacity 0.5s;
    }
    #loading-screen.hidden { opacity: 0; pointer-events: none; }
    #loading-bar-container { width: 200px; height: 4px; background: #1a1a2e; margin-top: 16px; border-radius: 2px; overflow: hidden; }
    #loading-bar { width: 0%; height: 100%; background: #4a9eff; transition: width 0.3s; }
    #loading-text { font-size: 12px; margin-top: 8px; color: #666; }
  </style>
</head>
<body>
  <div id="loading-screen">
    <div>IAI SURVIVORS</div>
    <div id="loading-bar-container"><div id="loading-bar"></div></div>
    <div id="loading-text">Loading...</div>
  </div>
  <canvas id="game-canvas"></canvas>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
